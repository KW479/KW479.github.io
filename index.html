    height: 3px;
    margin-bottom: 28px;
    border-radius: 2px;
    background: #1a1a1a;

  h1 {

    font-size: clamp(40px, 8vw, 60px);

    font-size: clamp(15px, 2.4vw, 18px);

  }

    padding-bottom: 2px;
    font-size: 15px;
    color: #1a1a1a;
    text-decoration: none;
    border-bottom: 1px solid #dedbd5;
    transition: border-color 0.18s ease;
  }

  .contact:hover { border-bottom-color: #1a1a1a; }

  .contact svg {
    width: 17px;
    height: 17px;
    flex: none;
    fill: currentColor;
  }

  footer {
    margin-top: 56px;
    font-size: 12px;
    color: #a8a5a0;
    letter-spacing: 0.01em;
  }

  a:focus-visible {
    outline: 2px solid #1a1a1a;
    outline-offset: 4px;
    border-radius: 2px;

  ::selection { background: #1a1a1a; color: #fcfcfa; }

  @media (max-width: 480px) {
    body { padding: 48px 22px; }

  @media (prefers-reduced-motion: reduce) {
